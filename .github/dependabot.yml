version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: daily
    time: "09:00"
  open-pull-requests-limit: 5
  groups:
    bundler-minor-patch:
      patterns:
      - "*"
      update-types:
      - minor
      - patch
- package-ecosystem: docker
  directory: "/"
  schedule:
    interval: daily
    time: "09:00"
  open-pull-requests-limit: 5
  groups:
    docker-minor-patch:
      patterns:
      - "*"
      update-types:
      - minor
      - patch
